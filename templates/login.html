{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="wrap">
  <div class="form-page">
    <span class="eyebrow">Welcome back</span>
    <h1>Log in to CraftConnect</h1>
    <p class="subtitle">Access your orders, dashboard, or admin tools.</p>
    <form method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-block">Log in</button>
    </form>
     
    <p class="form-footnote">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
